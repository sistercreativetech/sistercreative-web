# Stack produksi website Sister Creative.
# Jalankan di VPS:  docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Default (Pilihan A): Caddy internal hanya terbuka di 127.0.0.1:8080, lalu reverse proxy
# yang sudah ada di VPS (mis. Traefik bawaan template n8n) diarahkan ke sana.
# Pilihan B (tanpa proxy lain): lihat README bagian "Deploy".

name: sistercreative

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy-data:/data
    # Pilihan A dengan Traefik: hapus "ports" di atas, hubungkan ke jaringan Traefik,
    # dan aktifkan label berikut (sesuaikan nama entrypoint/certresolver Traefik Anda).
    # networks: [default, traefik]
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.sistercreative.rule=Host(`sistercreative.tech`) || Host(`www.sistercreative.tech`)
    #   - traefik.http.routers.sistercreative.entrypoints=websecure
    #   - traefik.http.routers.sistercreative.tls.certresolver=mytlschallenge
    #   - traefik.http.services.sistercreative.loadbalancer.server.port=80

volumes:
  postgres-data:
  media:
  caddy-data:

