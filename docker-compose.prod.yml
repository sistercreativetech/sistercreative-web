# Stack produksi website Sister Creative (VPS Hostinger srv1967964).
# Jalankan di VPS:  docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Lalu lintas: Cloudflare -> Traefik (network host, sudah ada di VPS) -> caddy -> web -> db
# Traefik menemukan container lewat label di layanan "caddy" (pola sama dengan n8n).
# Django bergabung ke jaringan WAHA agar bisa memanggil WAHA secara internal (http://waha:3000).

name: sistercreative

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
    networks:
      - default
      - waha

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - web
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy-data:/data
    labels:
      - traefik.enable=true
      - traefik.docker.network=sistercreative_default
      - traefik.http.routers.sistercreative.rule=Host(`sistercreative.tech`) || Host(`www.sistercreative.tech`)
      - traefik.http.routers.sistercreative.entrypoints=websecure
      - traefik.http.routers.sistercreative.tls.certresolver=letsencrypt
      - traefik.http.services.sistercreative.loadbalancer.server.port=80

volumes:
  postgres-data:
  media:
  caddy-data:

networks:
  default:
    name: sistercreative_default
  waha:
    external: true
    name: waha-f516_default
