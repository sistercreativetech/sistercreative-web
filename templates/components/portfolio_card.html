<article class="flex flex-col rounded-card border border-white/10 bg-dark-raised p-6 md:p-8"
         data-reveal>
  <div class="flex justify-between text-xs font-extrabold uppercase tracking-widest text-primary-light">
    <span>{{ item.category }}</span>
    <span>0{{ number }}</span>
  </div>
  <h3 class="mt-10 mb-3.5 text-2xl font-bold leading-tight md:mt-14">{{ item.title }}</h3>
  <p class="text-on-dark-muted">{{ item.summary }}</p>
  <ul class="mt-6 flex flex-wrap gap-2" aria-label="Teknologi">
    {% for tag in item.tags %}<li class="rounded-full bg-white/10 px-2.5 py-1.5 text-xs text-on-dark-muted">{{ tag }}</li>{% endfor %}
  </ul>
</article>
