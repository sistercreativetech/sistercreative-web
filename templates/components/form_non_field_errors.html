{% comment %}Error tingkat form (bukan per field). Pakai: {% include "components/form_non_field_errors.html" %}{% endcomment %}
{% if form.non_field_errors %}
  <div class="rounded-button border border-danger/30 bg-danger-soft px-4 py-3 text-sm font-semibold text-danger"
       role="alert">
    {% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}
  </div>
{% endif %}
