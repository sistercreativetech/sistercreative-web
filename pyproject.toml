[project]
name = "sistercreative-website"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy", "node_modules", "staticfiles", "**/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/tests*.py" = ["S101", "S105", "S106", "S107"]

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 120
ignore = "H006,H030"
custom_blocks = "element,slot,setvar"
# Email butuh inline style (email client tidak membaca CSS eksternal).
per-file-ignores = { "templates/emails/campaign.html" = "H021" }
